# End-to-end evaluation for the update-docs coordinator.
# Tests the full chain: CLAUDE.md audit + beads audit + human-tasks audit,
# all in a single prompt. Measures whether the coordinator-level instructions
# produce correct outputs across all three domains simultaneously.

setup: 
  before: reset_eval.sh
  after: reset_eval.sh

runner: agentic

agent_options:
  max_turns: 60
  allowed_tools:
    - list_directory
    - read_file
    - write_file
    - run_command

prompt-under-eval: "~/.claude/skills/update-docs/SKILL.md"

model_for_eval: claude-haiku-4-5-20251001

model_parameters:
  max_tokens: 15000

deterministic_checks:
  # Beads checks
  - name: SHOULD close k0w in beads (health check is implemented)
    type: file_contains
    file: .beads/interactions.jsonl
    values:
      - '"issue_id":"stage-four-cert-k0w"'
      - '"new_value":"closed"'

  - name: SHOULD close 5bs in beads (cache module is implemented)
    type: file_contains
    file: .beads/interactions.jsonl
    values:
      - '"issue_id":"stage-four-cert-5bs"'
      - '"new_value":"closed"'

  - name: SHOULD NOT touch 3ey in beads (log aggregation not implemented)
    type: file_does_not_contain
    file: .beads/interactions.jsonl
    values:
      - '"issue_id":"stage-four-cert-3ey"'

  - name: SHOULD output Beads Audit header with Closed section
    type: contains
    values:
      - "## Beads Audit"
      - "**Closed**"

  - name: SHOULD report k0w and 5bs as closed in audit output
    type: contains
    values:
      - "stage-four-cert-k0w"
      - "stage-four-cert-5bs"

  - name: SHOULD write audit artifact to audit_log/
    type: contains
    values:
      - "audit_log/update-beads-"

  # CLAUDE.md checks
  - name: Health route added to CLAUDE.md
    type: file_contains
    file: CLAUDE.md
    values:
      - "/api/health"
  - name: Cache module added to CLAUDE.md
    type: file_contains
    file: CLAUDE.md
    values:
      - "cache.ts"
    
  # Human-tasks checks
  - name: SHOULD mark health routes complete
    type: file_contains
    file: human-tasks/001-setup.md
    values: 
      - "- [x] Create `src/app/api/health/route.ts` file"
      - "- [x] Implement `GET /api/health` endpoint"
  - name: SHOULD uncheck previously checked items if they are not found in the work.
    type: file_does_not_contain
    file: human-tasks/001-setup.md
    values:
      - "- [ ] Create `src/app/api/users/route.ts` file"
  - name: SHOULD NOT check off items that are not done in the codebase (e.g. credentials, manual verification)
    type: file_contains
    file: human-tasks/001-setup.md
    values:
      - "- [ ] Implement `POST /api/users` endpoint"

model_evaluation:
  enabled: true
  model: claude-sonnet-5-5
  rubric: |
    You are evaluating a full documentation audit response covering three areas.
    Score each area independently on a 1-5 scale.

    Expected correct findings:

    CLAUDE.md gaps: GET /api/health route, src/cache.ts, HEALTH_CHECK_INTERVAL env var, node-cache dependency
    Beads decisions: close k0w (health route done), close 5bs (cache.ts done), leave 3ey open (no logging)
    Human-tasks: check off health route items; do NOT check credential items (DATABASE_URL, API_KEY, Provision DB); add HEALTH_CHECK_INTERVAL item

    ---
    ## CLAUDE.md (score 1-5)

    5 - Found all 3-4 gaps (health route, cache.ts, HEALTH_CHECK_INTERVAL, node-cache); updated CLAUDE.md accurately for each.
    4 - Found at least 3 of 4 gaps and updated them; minor formatting issues acceptable.
    3 - Found 2 gaps and updated them correctly; missed the others.
    2 - Found only 1 gap, or made partially incorrect updates.
    1 - Found none, or made updates that were wrong or inconsequential.

    ---
    ## Beads (score 1-5)

    5 - Correctly closed k0w and 5bs; correctly left 3ey open with no changes.
    4 - Closed k0w and 5bs correctly; minor output formatting issues; 3ey untouched.
    3 - Got 2 of 3 decisions right (e.g., closed one of k0w/5bs, left 3ey alone).
    2 - Got 1 decision right; or closed 3ey incorrectly.
    1 - No correct decisions, or closed 3ey when it should have been left open.

    ---
    ## Human Tasks (score 1-5)

    5 - Checked off all health route items; did NOT check credential/infra items (DATABASE_URL, API_KEY, Provision DB); added HEALTH_CHECK_INTERVAL to-do item.
    4 - Checked off health route items; no credential items auto-completed; minor gap acceptable (e.g., missing HEALTH_CHECK_INTERVAL add, or checked off an infra-verification item inferred from code).
    3 - Checked off health route items but made one notable error (e.g., re-unchecked a valid item, or left health items unchecked).
    2 - Partial check-offs with a significant error: marked a credential item as done (DATABASE_URL, API_KEY, or Provision DB).
    1 - No meaningful updates, or auto-completed credential items.

    ---
    A score of 4+ in each area is passing.

    Return a JSON object:
    { "claude_md_score": <1-5>, "beads_score": <1-5>, "human_tasks_score": <1-5>, "reasoning": "<brief explanation per area>" }
