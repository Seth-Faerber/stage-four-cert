# End-to-end evaluation for the update-docs coordinator.
# Tests the full chain: CLAUDE.md audit + beads audit + human-tasks audit,
# all in a single prompt. Measures whether the coordinator-level instructions
# produce correct outputs across all three domains simultaneously.

# prompt-under-eval: |
#   You are auditing a project's documentation — CLAUDE.md, beads issues, and human-tasks
#   checklists — against the actual codebase state.

#   Given the full context below, produce a structured audit covering all three domains:

#   1. CLAUDE.md: Identify every discrepancy (missing, stale, or wrong information). Check all
#      sections: overview/stack, commands, API routes, directory structure, and environment variables.

#   2. Beads issues: For each open issue, decide: close (work is done), leave (not done), or flag (ambiguous).

#   3. Human-tasks: Only evaluate items currently marked [ ] (incomplete). For each:
#      - check_off: ONLY if codebase source code directly proves the feature is implemented (e.g. a route file exists, a dependency is in package.json). These MUST go in leave, not check_off: copying/creating local files, setting env vars, provisioning databases, obtaining credentials, running manual tests, verifying runtime behavior.
#      - leave: requires human action (infrastructure, credentials, copying files, manual testing, runtime verification) — add to leave
#      - flag: genuinely ambiguous — add to flag
#      Do NOT include items already marked [x] in any list. Note new items to add based on what's new in the codebase.

#   Return your findings as a single JSON object:
#   {
#     "claude_md": {
#       "findings": [
#         { "section": "<section>", "action": "add|update|remove", "detail": "<one line>" }
#       ]
#     },
#     "beads": {
#       "decisions": [
#         { "id": "<id>", "title": "<title>", "decision": "close|leave|flag", "reason": "<one line>" }
#       ]
#     },
#     "human_tasks": {
#       "check_off": [ { "item": "<currently-incomplete item now proven done>", "evidence": "<one line>" } ],
#       "leave": [ { "item": "<item>", "reason": "<why>" } ],
#       "flag": [ { "item": "<item>", "reason": "<why>" } ],
#       "add": [ { "item": "<new item>", "reason": "<why>" } ]
#     }
#   }

setup: 
  before: reset_eval.sh
  after: reset_eval.sh

prompt-under-eval: "~/.claude/skills/update-docs/SKILL.md"

test_input:
  claude_md: |
    # Stage Four Cert — Project Guide

    ## Overview
    A minimal Node.js/Express API demonstrating JWT authentication and user management. Built with TypeScript.
    **Stack**: Express, TypeScript, dotenv, jsonwebtoken

    ## Common Commands
    | Command | Description |
    |---------|-------------|
    | `npm start` | Start the server (ts-node) |
    | `npm test` | No test runner configured yet |

    ## Architecture

    ### API Routes
    | Route | Auth | Description |
    |-------|------|-------------|
    | `GET /api/users` | Required | List all users |
    | `GET /api/users/:id` | Required | Get a single user |

    ### Directory Structure
    ```
    src/
      index.ts
      auth.ts
      app/api/users/route.ts
    ```

    ## Environment Variables
    | Variable | Required | Description |
    |----------|----------|-------------|
    | `DATABASE_URL` | Yes | PostgreSQL connection string |
    | `JWT_SECRET` | Yes | Secret for signing/verifying JWTs |
    | `API_KEY` | Yes | External API key |
    | `PORT` | No | Server port (default: 3000) |

  open_issues: |
    ID: stage-four-cert-k0w | Title: Add health check endpoint | Status: open
    Body: Add GET /api/health that returns {status: ok, timestamp}. No auth required.

    ID: stage-four-cert-5bs | Title: Add in-memory caching layer | Status: in_progress
    Body: Add a simple cache module to reduce repeated computation. Consider node-cache.

    ID: stage-four-cert-3ey | Title: Set up log aggregation | Status: open (blocked by 5bs)
    Body: Configure structured logging. Blocked on ops team provisioning log destination.

  human_tasks: |
    ## Environment Setup
    - [x] Clone the repository
    - [x] Install Node.js 20+
    - [x] Run `npm install`
    - [ ] Copy `.env.example` to `.env` and fill in values
    - [ ] Provision a PostgreSQL database and set `DATABASE_URL`
    - [ ] Obtain API key and set `API_KEY`

    ## Application Verification
    - [x] Confirm `npm start` launches without errors
    - [ ] Verify JWT authentication works (test with a valid token against GET /api/users)
    - [ ] Confirm database connection is live

    ## Ongoing
    - [ ] Set up log aggregation for production

  codebase_context: |
    package.json dependencies: express, dotenv, jsonwebtoken, node-cache
    .env.example vars: DATABASE_URL, API_KEY, JWT_SECRET, HEALTH_CHECK_INTERVAL
    Note: .env does NOT exist. No credentials have been set. No database has been provisioned.

    Source files:
      src/index.ts, src/auth.ts, src/cache.ts (NEW), src/app/api/users/route.ts
      src/app/api/health/route.ts (NEW — GET /api/health, no auth required)

    Recent git log:
      abc123 Add health check endpoint and cache module
      518d6bc feat: State A

model_for_eval: claude-haiku-4-5-20251001

model_parameters:
  max_tokens: 3000

deterministic_checks:
  - name: Returns all three domains in JSON
    type: contains
    values:
      - '"claude_md"'
      - '"beads"'
      - '"human_tasks"'

  - name: Identifies health check gap in CLAUDE.md
    type: contains
    values:
      - "health"

  - name: References health check beads issue for closure
    type: contains
    values:
      - "stage-four-cert-k0w"

  - name: References caching beads issue
    type: contains
    values:
      - "stage-four-cert-5bs"

model_evaluation:
  enabled: true
  model: claude-sonnet-5-5
  rubric: |
    You are evaluating a full documentation audit response covering CLAUDE.md, beads, and human-tasks.

    Expected correct findings:

    CLAUDE.md (3-4 gaps):
    - GET /api/health route missing from API Routes table
    - src/cache.ts missing from Directory Structure
    - HEALTH_CHECK_INTERVAL missing from Environment Variables
    - node-cache missing from Stack/dependencies

    Beads (3 decisions):
    - stage-four-cert-k0w: CLOSE (health route implemented)
    - stage-four-cert-5bs: CLOSE (cache.ts with node-cache implemented)
    - stage-four-cert-3ey: LEAVE (no logging infrastructure)

    Human-tasks:
    - Do NOT check off any credential/manual-verification items
    - ADD: something about HEALTH_CHECK_INTERVAL needing to be set

    Score 5: All three domains correct; no false auto-completions of credential/infra items; HEALTH_CHECK_INTERVAL add item present
    Score 4: CLAUDE.md and beads fully correct; human-tasks minor issues acceptable (e.g. checking off JWT auth item because auth.ts exists is borderline OK; missing HEALTH_CHECK_INTERVAL add is a minor gap). Core rule: credential and infrastructure items (DATABASE_URL, API_KEY, Provision DB) must NOT be in check_off.
    Score 3: One domain has notable errors; e.g. checking off DATABASE_URL or API_KEY provisioning items, or beads decisions wrong
    Score 2: Two or more domains significantly wrong
    Score 1: Mostly wrong or no structured output

    A score of 4+ is passing.

    Return a JSON object: { "score": <1-5>, "reasoning": "<brief explanation>" }
