# Isolated evaluation for the update-beads skill.
# Tests whether the skill's reasoning correctly identifies which beads issues
# should be closed given a pre-gathered codebase snapshot. State B: health check
# and caching are implemented, but their issues are still open.

setup:
  before: reset_eval.sh
  after: reset_eval.sh

runner: agentic

agent_options:
  max_turns: 15
  allowed_tools:
    - list_directory
    - read_file
    - write_file
    - run_command

prompt-under-eval: "~/.claude/skills/update-beads/SKILL.md"

model_for_eval: claude-haiku-4-5-20251001

model_parameters:
  max_tokens: 1500

deterministic_checks:
  - name: SHOULD close k0w in beads (health check is implemented)
    type: file_contains
    file: .beads/interactions.jsonl
    values:
      - '"issue_id":"stage-four-cert-k0w"'
      - '"new_value":"closed"'

  - name: SHOULD close 5bs in beads (cache module is implemented)
    type: file_contains
    file: .beads/interactions.jsonl
    values:
      - '"issue_id":"stage-four-cert-5bs"'
      - '"new_value":"closed"'

  - name: SHOULD NOT touch 3ey in beads (log aggregation not implemented)
    type: file_does_not_contain
    file: .beads/interactions.jsonl
    values:
      - '"issue_id":"stage-four-cert-3ey"'

  - name: SHOULD output Beads Audit header with Closed section
    type: contains
    values:
      - "## Beads Audit"
      - "**Closed**"

  - name: SHOULD report k0w and 5bs as closed in audit output
    type: contains
    values:
      - "stage-four-cert-k0w"
      - "stage-four-cert-5bs"

  - name: SHOULD write audit artifact to audit_log/
    type: contains
    values:
      - "audit_log/update-beads-"

model_evaluation:
  enabled: true
  model: claude-sonnet-5-5
  rubric: |
    You are evaluating a beads issue audit response. The auditor was given three open issues
    and a codebase snapshot. The correct decisions are:
    1. stage-four-cert-k0w (health check endpoint) — CLOSE: GET /api/health is implemented in src/app/api/health/route.ts
    2. stage-four-cert-5bs (in-memory caching) — CLOSE: src/cache.ts uses node-cache, which is in package.json
    3. stage-four-cert-3ey (log aggregation) — LEAVE: no logging infrastructure is in the codebase; still blocked

    Score 5: Correctly closes k0w and 5bs, correctly leaves 3ey
    Score 4: Gets 2 of 3 correct with reasonable reasoning
    Score 3: Gets 1 of 3 correct, or makes a wrong closure with no evidence
    Score 2: Closes log aggregation without evidence, or refuses to close the implemented ones
    Score 1: All decisions wrong or no decisions made

    A score of 4+ is passing.

    Return a JSON object: { "score": <1-5>, "reasoning": "<brief explanation>" }
