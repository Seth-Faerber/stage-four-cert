# Isolated evaluation for the update-claude-md skill.
# Tests whether the skill correctly identifies and fixes CLAUDE.md discrepancies
# against the actual codebase. State B: code updated, docs stale.
# A/B state: State B (stale CLAUDE.md) is committed at HEAD.
# reset_eval.sh restores it via `git checkout HEAD -- CLAUDE.md` before and after each run.

setup:
  before: reset_eval.sh
  after: reset_eval.sh

runner: agentic
agent_options:
  max_turns: 20
  allowed_tools: [list_directory, read_file, write_file, run_command]

prompt-under-eval: "~/.claude/skills/update-claude-md/SKILL.md"

model_for_eval: claude-haiku-4-5-20251001

model_parameters:
  max_tokens: 15000

deterministic_checks:
  - name: Health route added to CLAUDE.md
    type: file_contains
    file: CLAUDE.md
    values:
      - "/api/health"
  - name: Cache module added to CLAUDE.md
    type: file_contains
    file: CLAUDE.md
    values:
      - "cache.ts"

model_evaluation:
  enabled: true
  model: claude-sonnet-5-5
  rubric: |
    Score the model's response on a scale of 1 to 5 based on how well it audited and updated CLAUDE.md.

    5 - Found all three discrepancies (health route, cache.ts, HEALTH_CHECK_INTERVAL); updated CLAUDE.md accurately for each; wrote a valid JSON audit artifact to audit_log/; returned a correctly formatted ## CLAUDE.md Audit block.
    4 - Found and updated at least two discrepancies correctly; minor gap (e.g. missed env var or audit artifact format slightly off).
    3 - Found and updated at least one discrepancy; missed others or skipped writing the audit artifact.
    2 - Identified discrepancies in text output but did not actually update CLAUDE.md.
    1 - Failed to run, hallucinated changes not grounded in the codebase, or made no meaningful changes.

    Return a JSON object: { "score": <1-5>, "reasoning": "<brief explanation>" }
