# Isolated evaluation for the update-human-tasks skill.
# Tests whether the skill's reasoning correctly identifies which checklist items
# can be marked done given a pre-gathered codebase snapshot.

setup: reset_eval.sh

prompt-under-eval: "~/.claude/skills/update-human-tasks/SKILL.md"

test_input:
  already_done_do_not_touch: |
    - [x] Clone the repository
    - [x] Install Node.js 20+
    - [x] Run `npm install`
    - [x] Confirm `npm start` launches without errors

  incomplete_items_to_evaluate: |
    - [ ] Copy `.env.example` to `.env` and fill in values
    - [ ] Provision a PostgreSQL database and set `DATABASE_URL`
    - [ ] Obtain API key and set `API_KEY`
    - [ ] Verify JWT authentication works (test with a valid token against GET /api/users)
    - [ ] Confirm database connection is live (check logs for connection errors)
    - [ ] Set up log aggregation for production

  codebase_context: |
    package.json dependencies: express, dotenv, jsonwebtoken, node-cache

    .env.example: DATABASE_URL, API_KEY, JWT_SECRET, HEALTH_CHECK_INTERVAL
      *** TEMPLATE ONLY. No .env file exists. No credentials are set. No database provisioned. ***
      *** A variable name in .env.example does NOT mean it was obtained or configured. ***

    Source files:
      src/index.ts
      src/auth.ts
      src/cache.ts — new, uses HEALTH_CHECK_INTERVAL env var
      src/app/api/users/route.ts
      src/app/api/health/route.ts — new, GET /api/health (no auth required)

    Note: HEALTH_CHECK_INTERVAL was added to .env.example but is not in the setup checklist.
    No automated tests or CI configuration exists in the codebase.
    No logging infrastructure (no winston, pino, or similar) is present.

model_for_eval: claude-sonnet-5-5

model_parameters:
  max_tokens: 1500

deterministic_checks:
  - name: Returns JSON decisions
    type: contains
    values:
      - '"check_off"'

  - name: Flags credential items rather than checking them off
    type: contains
    values:
      - '"flag"'

  - name: Mentions HEALTH_CHECK_INTERVAL as something to add or flag
    type: contains
    values:
      - "HEALTH_CHECK_INTERVAL"

model_evaluation:
  enabled: true
  model: claude-sonnet-5-5
  rubric: |
    You are evaluating a human-tasks checklist audit. The auditor was given a stale checklist
    and an updated codebase. The correct decisions are:

    LEAVE/FLAG (require human action — do NOT check off):
    - "Copy .env.example to .env and fill in values" — human action required
    - "Provision a PostgreSQL database and set DATABASE_URL" — infrastructure, can't verify from code
    - "Obtain API key and set API_KEY" — credentials, human must confirm
    - "Verify JWT authentication works" — requires manual test
    - "Confirm database connection is live" — runtime verification
    - "Set up log aggregation for production" — no logging infrastructure in codebase

    ADD (new items the checklist is missing):
    - Something about HEALTH_CHECK_INTERVAL being a new env var that needs to be set
    - OR something about the new /api/health endpoint being available to verify

    The auditor should NOT auto-check off credential or manual-verification items.

    The correct decisions for each incomplete item:
    - "Copy .env.example to .env" → LEAVE (copying files, human action)
    - "Provision PostgreSQL database / set DATABASE_URL" → LEAVE or FLAG (infrastructure)
    - "Obtain API key / set API_KEY" → LEAVE or FLAG (credentials)
    - "Verify JWT authentication works (test with a valid token)" → LEAVE (requires runtime test with real token)
    - "Confirm database connection is live" → LEAVE (runtime verification)
    - "Set up log aggregation" → LEAVE (no logging infrastructure in codebase)

    Score 5: All six items correctly in leave/flag; HEALTH_CHECK_INTERVAL env var added
    Score 4: At most one item is wrong (e.g. JWT checked off because auth.ts exists is borderline acceptable); HEALTH_CHECK_INTERVAL may be missing from add
    Score 3: Two items wrong, OR DATABASE_URL/API_KEY/Provision DB in check_off (clear credential violations)
    Score 2: Three or more items wrong
    Score 1: Mostly wrong or no useful output

    A score of 4+ is passing.

    Return a JSON object: { "score": <1-5>, "reasoning": "<brief explanation>" }
